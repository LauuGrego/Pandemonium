name: Daily News Fetch and Deploy

on:
  schedule:
    - cron: "0 0,12 * * *" # Todos los días a las 00:00 y a las 12:00 UTC (2 veces al día)
  workflow_dispatch: # Permite ejecución manual
  push:
    branches:
      - main
    paths-ignore:
      - "news.json"

permissions:
  contents: write # Hacer commit de news.json
  deployments: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run script to fetch news
        run: yarn build:news

      - name: Commit and push changes
        id: commit_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update news twice daily from Infobae" && git push)

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: "."
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions (Commit ${{ github.sha }})"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

