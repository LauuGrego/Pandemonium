name: Daily News Fetch

on:
  schedule:
    - cron: "0 0,12 * * *" # Todos los días a las 00:00 y a las 12:00 UTC (2 veces al día)
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write # Hacer commit de news.json

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run script to fetch news
        run: yarn build:news
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Commit and push changes
        id: commit_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update news twice daily via SerpApi & sources" && git push)
